name: Byggsteg
on:
  push:
    branches:
      - trunk


jobs:
  byggsteg:
    runs-on: ubuntu-latest
    steps:
      - name: "trigger deploy new jointhefreeworld version at jointhefreeworld.org"
        run: |
           curl 'https://byggsteg.jointhefreeworld.org/api/jobs/submit' \
               -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
               -H 'Authorization: Basic ${{secrets.BYGGSTEG_KEY}}' \
               --data-urlencode "job-code=\`((project . \"jointhefreeworld\")(branch-name . \"trunk\")(task . \"pull-and-deploy\")(clone-url . \"https://github.com/jjba23/jointhefreeworld\"))"

